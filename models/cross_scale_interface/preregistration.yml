  pareto_test:
    conditions: [all_15_partitions_enumerated]
    expected:
      registered_partition_on_symmetric_frontier: true
      identity_partition_dominated: true
  two_stage_admission:
    conditions: [nondegenerate_response, strict_compression, all_registered_errors_below_1e_10]
    expected:
      symmetric_exact_interface_labels: [A0A1|B0B1|D]
      heterogeneous_exact_interface_labels: []
